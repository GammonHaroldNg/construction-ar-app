<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>360 Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <style>
    html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
    #videoBg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 0; background: #000; }
    #backBtn { position: absolute; top: 20px; left: 20px; z-index: 2; }
    #ghostToggle { position: absolute; top: 90px; left: 20px; z-index: 2; }
    #ghostLabel  { position: absolute; top: 70px; left: 20px; z-index: 2; color: white; font-weight: bold; }
    #controls { position: absolute; top: 140px; left: 20px; z-index: 2; display: flex; flex-direction: column; gap: 10px; }
    a-scene { position: fixed !important; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; background: transparent !important;}
    .ctrl-btn { font-size: 1.1em; padding: 6px 14px; border-radius: 4px; background: #274AA1; color: white; border: none; cursor: pointer; }
    .ctrl-btn:disabled { background: #888; cursor: default; }
    #instructions { position: absolute; bottom: 25px; left: 20px; z-index: 2; color: #fff; background:rgba(0,0,0,0.5); padding:8px 15px; border-radius:6px; font-size:1em; }
  </style>
</head>
<body>
  <video id="videoBg" autoplay muted playsinline></video>
  <button id="backBtn" onclick="history.back()">Back</button>
  <label id="ghostLabel" for="ghostToggle">Ghost Mode</label>
  <input type="range" id="ghostToggle" min="0.2" max="1" step="0.01" value="1">

  <div id="controls">
    <button class="ctrl-btn" id="lockAlign">Lock Alignment</button>
    <button class="ctrl-btn" id="unlockAlign" disabled>Unlock Alignment</button>
    <button class="ctrl-btn" id="gyroBtn">Gyroscope On</button>
  </div>
  <div id="instructions">
    <b>How to align:</b><br>
    <ul>
      <li>Drag with one finger to rotate the rendering</li>
      <li>Pinch/expand with two fingers to zoom in/out</li>
      <li>Tap Lock/Unlock to toggle manual alignment</li>
      <li>Tap Gyroscope On/Off any time</li>
      <li>Ghost Mode: see-through rendering overlay</li>
    </ul>
  </div>
  <!-- WebGL alpha enabled for transparent background -->
  <a-scene embedded vr-mode-ui="enabled: false" renderer="alpha:true;">
    <a-entity 
      id="sky360"
      geometry="primitive: sphere; radius: 5000; segmentsWidth: 64; segmentsHeight: 64;"
      material="side: back; src: images/360-1.jpg; opacity: 1"
      scale="-1 1 1"
      rotation="0 0 0"
    ></a-entity>
    <a-camera id="mainCamera" position="0 0 0" look-controls="enabled: false;"></a-camera>
  </a-scene>
  <script>
    // Start camera stream as video background
    const video = document.getElementById('videoBg');
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(stream => { video.srcObject = stream; })
        .catch(err => { alert('Camera access denied or unavailable.'); });
    } else {
      alert('Camera API not supported.');
    }

    // Setup references
    const params = new URLSearchParams(location.search);
    const imgSrc = params.get("img") || "images/360-1.jpg";
    const skyEl = document.getElementById("sky360");
    skyEl.setAttribute("material", "src", imgSrc);
    skyEl.setAttribute("material", "opacity", 1);

    // Ghost Mode Opacity Control
    document.getElementById("ghostToggle").addEventListener("input", function(e) {
      skyEl.setAttribute('material', 'opacity', parseFloat(e.target.value));
    });

    // Gyroscope toggle logic
    const gyroBtn = document.getElementById("gyroBtn");
    const cameraEl = document.getElementById("mainCamera");
    let gyroActive = false;
    function updateGyroButton() {
      gyroBtn.textContent = gyroActive ? "Gyroscope Off" : "Gyroscope On";
    }
    gyroBtn.addEventListener("click", function() {
      gyroActive = !gyroActive;
      cameraEl.setAttribute("look-controls", `enabled: ${gyroActive}; touchEnabled: false;`);
      updateGyroButton();
    });
    updateGyroButton();

    // Alignment controls (lock/unlock) - gestures always allowed
    let controlsLocked = false;
    const lockBtn = document.getElementById("lockAlign");
    const unlockBtn = document.getElementById("unlockAlign");

    lockBtn.addEventListener("click", function() {
      controlsLocked = true;
      lockBtn.disabled = true;
      unlockBtn.disabled = false;
      alert("Alignment locked! Continue viewing with gyroscope or gestures.");
    });
    unlockBtn.addEventListener("click", function() {
      controlsLocked = false;
      lockBtn.disabled = false;
      unlockBtn.disabled = true;
    });

    // Mobile gestures: pinch/expend = zoom in/out (natural direction), drag = rotate
    let lastTouchX = null, lastRotationY = 0;
    let initialPinchDist = null, initialScale = -1;
    let sphereScale = -1;   // Start at -1 for correct orientation
    let rotationY = 0;

    function safeScale(val) {
      // Clamp value between -2 and -0.3 for reasonable zoom range
      return Math.max(-2, Math.min(-0.3, val));
    }
    const aScene = document.querySelector('a-scene');

    aScene.addEventListener('touchstart', function(e){
      if (controlsLocked) return;
      if (e.touches.length === 1) {
        lastTouchX = e.touches[0].clientX;
      }
      if (e.touches.length === 2) {
        initialPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialScale = sphereScale;
      }
    });

    aScene.addEventListener('touchmove', function(e){
      if (controlsLocked) return;
      // One finger: rotate horizontally
      if (e.touches.length === 1 && lastTouchX!==null) {
        let deltaX = e.touches[0].clientX - lastTouchX;
        rotationY += deltaX * 0.25;    // Adjust sensitivity as needed
        skyEl.setAttribute("rotation", `0 ${rotationY} 0`);
        lastTouchX = e.touches[0].clientX;
      }
      // Two fingers: pinch/expand (zoom out/in)
      if (e.touches.length === 2 && initialPinchDist!==null) {
        let newDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        let scaleFactor = newDist / initialPinchDist;
        sphereScale = safeScale(initialScale * scaleFactor); // Expanding = bigger, Pinch = smaller
        skyEl.setAttribute("scale", `${sphereScale} 1 1`);
      }
    });

    aScene.addEventListener('touchend', function(e){
      lastTouchX = null;
      initialPinchDist = null;
    });
  </script>
</body>
</html>
